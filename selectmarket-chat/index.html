  /* 레이아웃: 회색 캔버스 위 흰 카드 한 장. 탭 4개 알약, 대화, 빠른 질문, 입력. 프로젝트 모노톤 토큰(assets/style.css) 사용 */
  :root {
    --canvas: #dedddb; --bg: #ffffff; --ink: #161616; --text: #232323; --sub: #767676;
    --line: #e9e9e6; --soft: #f3f3f1; --me: #161616; --me-fg: #ffffff;
    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #0c0c0d; --bg: #161617; --ink: #f2f2f0; --text: #e4e4e1; --sub: #98988f;
      --line: #2a2a2c; --soft: #212123; --me: #f2f2f0; --me-fg: #161616; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #0c0c0d; --bg: #161617; --ink: #f2f2f0; --text: #e4e4e1; --sub: #98988f;
    --line: #2a2a2c; --soft: #212123; --me: #f2f2f0; --me-fg: #161616; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--canvas); color: var(--text); font-family: var(--font);
    font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
  }
  .card { max-width: 720px; height: 100%; margin: 0 auto; background: var(--bg); border-radius: 20px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  header { padding: 20px 20px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  header p { margin: 2px 0 0; color: var(--sub); font-size: 0.82rem; }
  .reset { border: 1px solid var(--line); background: transparent; color: var(--sub); font: inherit; font-size: 0.78rem; padding: 5px 11px; border-radius: 999px; cursor: pointer; flex: none; }
  .reset:hover { color: var(--ink); border-color: var(--ink); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0 20px; padding: 4px; background: var(--soft); border-radius: 999px; }
  .tab { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 0.8rem; font-weight: 500; padding: 7px 4px; border-radius: 999px; cursor: pointer; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .notice { margin: 12px 20px 0; padding: 9px 14px; background: var(--soft); border-radius: 12px; color: var(--sub); font-size: 0.8rem; }
  .log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--soft); color: var(--text); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-fg); border-bottom-right-radius: 6px; }
  .msg.err { background: transparent; border: 1px dashed var(--sub); color: var(--sub); }
  .pick { align-self: flex-start; width: min(86%, 340px); padding: 12px 14px; border: 1px solid var(--ink); border-radius: 16px; display: grid; gap: 2px; }
  .pick b { color: var(--ink); font-size: 0.95rem; }
  .pick span { color: var(--sub); font-size: 0.78rem; }
  .pick p { margin: 4px 0 0; font-size: 0.85rem; }
  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 20px 0; }
  .wk { border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; border-radius: 14px; padding: 8px 2px 9px; cursor: pointer; display: grid; gap: 1px; justify-items: center; min-width: 0; }
  .wk .wd { font-size: 0.72rem; color: var(--sub); }
  .wk b { font-size: 1.02rem; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .wk .wn { font-size: 0.72rem; color: var(--sub); white-space: nowrap; }
  .wk.today { background: var(--ink); border-color: var(--ink); }
  .wk.today .wd, .wk.today .wn { color: var(--bg); opacity: .75; }
  .wk.today b { color: var(--bg); }
  .wk:hover:not(.today) { border-color: var(--ink); }
  .health { margin: 8px 20px 0; padding: 9px 14px; border: 1px solid var(--ink); border-radius: 12px; color: var(--ink); font-size: 0.8rem; font-weight: 500; }
  .meters { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 6px 0 2px; font-size: 0.78rem; color: var(--sub); }
  .meters i { font-style: normal; letter-spacing: 2px; color: var(--ink); }
  .meters i s { text-decoration: none; opacity: .22; }
  .pick .day { color: var(--ink); font-variant-numeric: tabular-nums; }
  .moods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .moods .label { grid-column: 1 / -1; }
  .quick .moods button { padding: 11px 12px; border-radius: 14px; text-align: left; font-size: 0.86rem; }
  .src { align-self: flex-start; margin-top: -4px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--sub); font-size: 0.75rem; }
  .dots { align-self: flex-start; display: flex; gap: 4px; padding: 14px 16px; background: var(--soft); border-radius: 18px; border-bottom-left-radius: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 10px; }
  .quick button { border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 0.8rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .quick button:hover { border-color: var(--ink); color: var(--ink); }
  .quick .label { align-self: center; color: var(--sub); font-size: 0.75rem; }
  form { display: flex; gap: 8px; padding: 0 20px 20px; }
  textarea { flex: 1; min-width: 0; resize: none; font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--text); }
  .send { border: 0; background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; padding: 0 20px; border-radius: 14px; cursor: pointer; }
  .send:disabled { opacity: .35; cursor: default; }
  @media (max-width: 430px) {
    body { padding-block: 8px; } .card { border-radius: 16px; }
    header, .log, .quick, form { padding-left: 14px; padding-right: 14px; } .tabs, .notice, .week, .health { margin-left: 14px; margin-right: 14px; }
    .tab { font-size: 0.7rem; } .wk .wn { font-size: 0.66rem; }
  }
</style>

function renderTabs() {
  $("tabs").innerHTML = "";
  TABS.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");

    b.onclick = () => { cur = t.id; try { localStorage.setItem("smc-tab", cur); } catch (e) {} render(); };

  });
}
function bubble(role, text, err) {

}

}

  log.scrollTop = log.scrollHeight;
}
let busyTab = null;
function parseRich(raw) {
  let text = raw.trim(), follow = [], src = null, cards = [];
  const f = text.match(/\[다음 질문\]\s*(.+)$/m);
  if (f) { follow = f[1].split("|").map(s => s.trim()).filter(Boolean).slice(0, 2); text = text.replace(f[0], "").trim(); }
  text = text.replace(/^\[추천\]\s*(.+)$/gm, (m, body) => {
    const p = body.split("|").map(x => x.trim());
    cards.push({ name: p[0], when: p[1] || "", why: p[2] || "" }); return "";
  }).replace(/\n{3,}/g, "\n\n").trim();
  const s = text.match(/\(근거:\s*([^)]+)\)/);
  if (s) { src = s[1].trim(); text = text.replace(s[0], "").trim(); }
  return { text, src, follow, cards };
}
async function ask(text) {
  text = text.trim(); const t = tabOf(cur);
  if (!text || busy) return;
  const tabId = cur;
  state[tabId].push({ role: "me", text });
  $("input").value = "";
  if (t.mode === "fake") {
    const hit = FAKE.find(f => f[0].test(text));
    state[tabId].push({ role: "bot", text: hit ? hit[1] : FAKE_DEFAULT });
    render(); return;
  }
  health[tabId] = !!t.rich && HEALTH_RE.test(text);
  busy = true; busyTab = tabId; render();
  const history = state[tabId].slice(1).map(m => (m.role === "me" ? "사용자: " : "도우미: ") + m.text).join("\n");
  const prompt = t.system + "\n\n[지금까지의 대화]\n" + history + "\n\n위 대화에 이어 도우미의 다음 답만 써 줘. 앞에 '도우미:'는 붙이지 마.";
  try {
    const sample = await claude.use("sample");
    if (!sample) throw { code: "unavailable" };
    const r = await sample(prompt, { cache: false, modelTier: "quick" });
    const pr = t.rich ? parseRich(r.text) : null;
    if (pr) health[tabId] = health[tabId] || pr.src === "건강과 상담";
    state[tabId].push(t.rich ? Object.assign({ role: "bot" }, pr) : { role: "bot", text: r.text.trim() });
  } catch (e) {
    const msg = e && e.code === "not_granted" ? "허용하지 않아 답을 받지 못했어요. 다시 보내면 허용 창이 떠요."
      : e && e.code === "rate_limited" ? "요청이 많아요. 잠시 뒤에 다시 보내 주세요."
      : "이 화면에서는 AI를 부를 수 없어요. 클로드에 로그인한 브라우저에서 아티팩트 링크로 열어 주세요.";
    state[tabId].push({ role: "bot", text: msg, err: true });
  }
  busy = false; busyTab = null; render();
}
$("form").addEventListener("submit", e => { e.preventDefault(); ask($("input").value); });
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask($("input").value); } });
$("reset").onclick = () => { if (busy) return; state[cur] = fresh(tabOf(cur)); health[cur] = false; render(); };
try { const s = localStorage.getItem("smc-tab"); if (s && tabOf(s)) cur = s; } catch (e) {}
render();
</script>
